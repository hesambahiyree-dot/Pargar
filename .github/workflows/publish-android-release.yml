name: Publish Pargar Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-android:
    name: Build and publish APK to GitHub Releases
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build offline web app and Android project
        run: npm run build:android
        env:
          VITE_AUTH_ENABLED: "false"
          VITE_GROK_EXTENSIONS: "0"
          VITE_OFFLINE_BUILD: "1"
          DATABASE_URL: ""
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.1 android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Pargar Android v1.0.1" \
            --notes "نسخه اندروید پرگار برای نصب و آزمایش. این نسخه debug است و برای انتشار رسمی فروشگاهی امضای اختصاصی ندارد." \
            --target "${GITHUB_SHA}"
