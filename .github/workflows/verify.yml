name: Build and verify Pargar
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pargar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Typecheck, tests, production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
        env:
          VITE_AUTH_ENABLED: "false"
      - run: npm test
        env:
          VITE_AUTH_ENABLED: "false"
      - run: npm run build
        env:
          VITE_AUTH_ENABLED: "false"
          DATABASE_URL: ""
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pargar-web-build
          path: .output/public/
          if-no-files-found: error
          retention-days: 14
